name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate matrix snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: void4code
          outputs: |
            dist/matrix-snake.svg?color_snake=%2339FF14&color_dots=%23001a00,%23003300,%23009900,%2339FF14,%2300FF41&color_background=%23000000

      - name: push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
